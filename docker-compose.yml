services:
  db:
    image: postgres:17
    container_name: tesla_pool_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tesla_pool
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tesla_pool"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: